stages:
  - install
  - test
  - deploy

variables:
  DB_CONNECTION: mysql
  DB_HOST: "127.0.0.1"
  DB_PORT: "3306"
  DB_DATABASE: "laravel_ci"
  DB_USERNAME: "root"
  DB_PASSWORD: ""
  COMPOSER_ALLOW_SUPERUSER: "1"

# Cache dependencies to speed up builds
cache:
  paths:
    - vendor/
    - node_modules/

before_script:
  - apt-get update -y
  - apt-get install -y libpng-dev libjpeg-dev libfreetype6-dev
  - docker-php-ext-configure gd --with-freetype --with-jpeg
  - docker-php-ext-install gd
  - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
  - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
  - composer install

install_dependencies:
  stage: install
  script:
    - composer install
    - npm install
    - npm run dev
  only:
    - main  # Change to your default branch name

test:
  stage: test
  script:
    - php artisan key:generate
    - php artisan migrate --env=testing
    - php artisan test
  only:
    - main

deploy:
  stage: deploy
  script:
    - echo "Deploying Laravel project"
    - rsync -avz --exclude 'node_modules/' --exclude '.git/' ./ user@yourserver:/path/to/your/project
    - ssh user@yourserver 'cd /path/to/your/project && php artisan migrate --force && php artisan config:cache && php artisan route:cache'
  only:
    - main
